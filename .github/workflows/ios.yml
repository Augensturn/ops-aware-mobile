name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Install iOS dependencies
      run: |
        cd ios
        pod install --repo-update
        cd ..
      
    - name: List available simulators
      run: |
        xcrun simctl list devices available
      
    - name: Build iOS app for simulator
      run: |
        cd ios
        xcodebuild -workspace OpsAwareMobile.xcworkspace -scheme OpsAwareMobile -configuration Release -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.6' BUILD_DIR=build
        cd ..
      
    - name: Find simulator app and create IPA
      run: |
        SIMULATOR_APP=$(find ios/build -name "*.app" -type d | head -1)
        
        if [ -n "$SIMULATOR_APP" ]; then
          echo "Found simulator app: $SIMULATOR_APP"
          mkdir Payload
          cp -r "$SIMULATOR_APP" Payload/
          zip -q -r ops-aware-mobile.ipa Payload
          rm -rf Payload
          echo "IPA created from simulator build"
          ls -lh *.ipa
        else
          echo "Error: No .app file found"
          echo "Build directory contents:"
          find ios/build -type f -name "*" 2>/dev/null | head -20
          exit 1
        fi
      
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Simulator-IPA
        path: ops-aware-mobile.ipa
        retention-days: 30
