name: Build iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Verify project structure
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo "=== iOS Directory ==="
        ls -la ios/ || echo "iOS directory not found"
        echo "=== Package.json ==="
        cat package.json
        
    - name: Install dependencies
      run: npm install
      
    - name: Install iOS dependencies
      run: |
        cd ios
        pod install --repo-update
        cd ..
      
    - name: Build iOS app using Xcode
      run: |
        cd ios
        xcodebuild -workspace OpsAwareMobile.xcworkspace -scheme OpsAwareMobile -configuration Release -destination 'generic/platform=iOS' -archivePath build/OpsAwareMobile.xcarchive archive
        xcodebuild -exportArchive -archivePath build/OpsAwareMobile.xcarchive -exportPath build -exportOptionsPlist ExportOptions.plist
        cd ..
      
    - name: Create IPA
      run: |
        APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          echo "Creating IPA from: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -q -r ops-aware-mobile.ipa Payload
          rm -rf Payload
          echo "IPA created successfully"
          ls -lh *.ipa
        else
          echo "Error: No .app file found in build directory"
          echo "Build directory contents:"
          find ios/build -type f -name "*" 2>/dev/null | head -20 || echo "Build directory not found"
          exit 1
        fi
      
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App-IPA
        path: ops-aware-mobile.ipa
        retention-days: 30
