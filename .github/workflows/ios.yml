name: Build iOS IPA (Signed + Stable)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA Export Method (ad-hoc / app-store / enterprise / development)"
        required: false
        default: "ad-hoc"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ 安装依赖
      - name: Install JS dependencies
        run: npm ci

      # 4️⃣ 安装 CocoaPods 依赖
      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install --verbose
          cd ..

      # 5️⃣ 导入签名证书与描述文件
      - name: Setup signing certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          mkdir -p ~/certs
          echo "📥 导入签名证书..."
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > ~/certs/cert.p12
          security create-keychain -p "" ios-build.keychain
          security import ~/certs/cert.p12 -k ~/Library/Keychains/ios-build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s ~/Library/Keychains/ios-build.keychain
          security default-keychain -s ~/Library/Keychains/ios-build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/ios-build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/ios-build.keychain

      - name: Setup provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # 6️⃣ 构建并签名 Release 版本
      - name: Build iOS Release (Signed)
        run: |
          cd ios
          echo "🚀 Building signed release IPA for device..."
          xcodebuild \
            -workspace OpsAwareMobile.xcworkspace \
            -scheme OpsAwareMobile \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            BUILD_DIR=build \
            clean build | xcpretty
          cd ..

      # 7️⃣ 导出 IPA
      - name: Export signed IPA
        run: |
          cd ios
          mkdir -p export
          cat <<EOF > export/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ github.event.inputs.export_method }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          echo "📦 Exporting signed IPA..."
          xcodebuild -exportArchive \
            -archivePath build/Release-iphoneos/OpsAwareMobile.xcarchive \
            -exportOptionsPlist export/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates
          cd ..

      # 8️⃣ 上传成品
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpsAwareMobile-Signed-IPA
          path: ios/build/ipa/*.ipa
          retention-days: 30
