name: Build iOS App (Stable)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      # 1️⃣ 拉取项目代码
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ 安装 JS 依赖
      - name: Install dependencies
        run: npm install

      # 4️⃣ 安装 iOS CocoaPods 依赖
      - name: Install CocoaPods
        run: |
          cd ios
          echo "🧹 清理旧缓存..."
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData
          pod repo update
          pod install
          cd ..

      # 5️⃣ 构建 iOS 模拟器版本
      - name: Build iOS App
        run: |
          cd ios
          echo "🚧 正在构建 iOS 模拟器版 (iPhone 16 Pro Max, iOS 18.5)..."
          xcodebuild -workspace OpsAwareMobile.xcworkspace \
            -scheme OpsAwareMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.5' \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR=build \
            ONLY_ACTIVE_ARCH=YES \
            -quiet
          cd ..

      # 6️⃣ 查找 .app 并清理非法文件名再打包成 .ipa
      - name: Package Clean IPA
        run: |
          SIM_APP=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$SIM_APP" ]; then
            echo "❌ 未找到 .app 文件"
            find ios/build -type f | head -20
            exit 1
          fi

          echo "✅ 找到 .app 文件: $SIM_APP"
          mkdir Payload
          cp -r "$SIM_APP" Payload/

          echo "🧹 清理非法文件名（中文、空格、特殊字符）..."
          find Payload -depth | while read f; do
            clean=$(echo "$f" | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null | sed 's/[^A-Za-z0-9._\/-]/_/g')
            if [ "$f" != "$clean" ]; then
              mv "$f" "$clean" 2>/dev/null || true
            fi
          done

          echo "📦 打包 IPA..."
          zip -q -r ops-aware-mobile.ipa Payload
          rm -rf Payload

          echo "✅ IPA 生成成功"
          ls -lh *.ipa

      # 7️⃣ 上传 IPA 产物
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: ops-aware-mobile.ipa
          retention-days: 30
