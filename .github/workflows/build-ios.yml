name: Build iOS IPA (Xcode 16.1+ Compatible)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.1+
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install JS deps
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci || npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          cd ios
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData
          pod deintegrate
          pod repo update
          pod install --repo-update
          cd ..

      - name: Prebuild all React Native libs
        run: |
          cd ios
          echo "🚧 Prebuilding static libs..."
          xcodebuild -workspace OpsAwareMobile.xcworkspace \
            -scheme Pods-OpsAwareMobile \
            -sdk iphonesimulator \
            -configuration Release \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            EXCLUDED_ARCHS=arm64 \
            clean build
          cd ..

      - name: Build main iOS target
        run: |
          cd ios
          echo "🚧 Building main app..."
          xcodebuild \
            -workspace OpsAwareMobile.xcworkspace \
            -scheme OpsAwareMobile \
            -sdk iphonesimulator \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            EXCLUDED_ARCHS=arm64 \
            OTHER_LDFLAGS="-ObjC -lc++ -lz -lstdc++ -lDoubleConversion"
          cd ..

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found!"
            exit 1
          fi
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r OpsAwareMobile.ipa Payload >/dev/null
          rm -rf Payload
          echo "✅ IPA packaged successfully"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpsAwareMobile-IPA
          path: "*.ipa"
          retention-days: 14
