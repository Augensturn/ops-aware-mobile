name: Build iOS IPA (Signed + Stable)

on:
  workflow_dispatch:  # 手动触发
  push:
    branches:
      - main  # 如果你的主分支叫 master，请改成 master

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      # 1️⃣ 拉取项目源码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ 设置 npm 国内源（防止依赖下载失败）
      - name: Set NPM registry
        run: npm config set registry https://registry.npmmirror.com

      # 4️⃣ 安装依赖（兼容 npm ci / install）
      - name: Install dependencies
        run: |
          rm -rf node_modules
          if [ -f package-lock.json ]; then
            npm ci || npm install --force
          else
            npm install --force
          fi

      # 5️⃣ 安装 iOS 依赖
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData
          pod repo update
          pod install
          cd ..

      # 6️⃣ 列出模拟器
      - name: List available simulators
        run: xcrun simctl list devices available

      # 7️⃣ 构建 iOS 模拟器版 APP（Xcode）
      - name: Build iOS App for simulator
        run: |
          cd ios
          echo "🚧 正在构建 iOS 模拟器版 (iPhone 16 Pro Max, iOS 18.5)..."
          xcodebuild \
            -workspace OpsAwareMobile.xcworkspace \
            -scheme OpsAwareMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.5' \
            -derivedDataPath build \
            BUILD_DIR=build
          cd ..

      # 8️⃣ 查找 .app 文件并打包成 IPA
      - name: Package .app into IPA
        run: |
          echo "📦 正在查找 .app 文件..."
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "✅ 找到应用: $APP_PATH"
            mkdir Payload
            cp -r "$APP_PATH" Payload/
            # 移除潜在非法字符（如中文或空格）
            IPA_NAME="OpsAwareMobile_$(date +%Y%m%d_%H%M%S).ipa"
            zip -r "$IPA_NAME" Payload >/dev/null
            rm -rf Payload
            echo "✅ IPA 打包完成: $IPA_NAME"
          else
            echo "❌ 未找到 .app 文件"
            find ios/build -type d | head -20
            exit 1
          fi

      # 9️⃣ 上传 IPA 文件为 Artifact（可下载）
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpsAwareMobile-Signed-IPA
          path: "*.ipa"
          retention-days: 30
