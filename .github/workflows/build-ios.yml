name: Build iOS (React Native + Hermes Fixed)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install JS dependencies
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci || npm install --legacy-peer-deps

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods -N
          cd ios
          rm -rf Pods Podfile.lock ~/Library/Developer/Xcode/DerivedData
          pod deintegrate
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build all Pods to warm cache
        run: |
          cd ios
          echo "🚧 Prebuilding Pods..."
          xcodebuild -workspace OpsAwareMobile.xcworkspace \
            -scheme Pods-OpsAwareMobile \
            -sdk iphonesimulator \
            -configuration Release \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            EXCLUDED_ARCHS=arm64 \
            build
          cd ..

      - name: Build iOS App
        run: |
          cd ios
          echo "🚧 Building main app..."
          xcodebuild \
            -workspace OpsAwareMobile.xcworkspace \
            -scheme OpsAwareMobile \
            -sdk iphonesimulator \
            -configuration Release \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro Max,OS=18.5" \
            -derivedDataPath build \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            EXCLUDED_ARCHS=arm64 \
            OTHER_LDFLAGS="-ObjC"
          cd ..

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found!"
            exit 1
          fi
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r OpsAwareMobile.ipa Payload >/dev/null
          rm -rf Payload
          echo "✅ IPA packaged successfully"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpsAwareMobile-IPA
          path: "*.ipa"
          retention-days: 14
