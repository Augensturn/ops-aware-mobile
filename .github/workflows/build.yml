name: Build iOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install Cordova and iOS dependencies
      run: |
        npm install -g cordova
        sudo gem install cocoapods
        
    - name: Clean and recreate iOS platform
      run: |
        rm -rf platforms/ios
        cordova platform add ios
        
    - name: Build iOS app
      run: |
        cordova build ios --device
        
    - name: Find and list build outputs
      run: |
        echo "=== Searching for build outputs ==="
        find platforms/ios -name "*.ipa" -o -name "*.app" | head -10
        echo "=== Build directory structure ==="
        find platforms/ios/build -type f -name "*" | head -20
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Build
        path: |
          platforms/ios/build/**/*.ipa
          platforms/ios/build/**/*.app
        if-no-files-found: warn
        retention-days: 7
