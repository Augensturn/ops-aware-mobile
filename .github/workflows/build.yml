name: Build Stable iOS IPA

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Clean and setup Cordova
      run: |
        npm install -g cordova
        rm -rf platforms/ios
        rm -rf plugins/
        
    - name: Configure project
      run: |
        sed -i.bak 's/<name>运维态势感知平台<\/name>/<name>OpsAwarePlatform<\/name>/' config.xml
        sed -i.bak 's/<platform name="ios">/<platform name="ios">\
        <preference name="deployment-target" value="12.0" \/>/' config.xml
        
    - name: Add iOS platform and build
      run: |
        cordova platform add ios
        cordova build ios --device
        
    - name: Create clean IPA
      run: |
        APP_DIR=$(find platforms/ios/build -name "*.app" -type d | head -1)
        if [ -n "$APP_DIR" ]; then
          echo "Packaging $APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -q -r -y ops-aware.ipa Payload
          rm -rf Payload
          echo "IPA created"
        else
          echo "Error: No app found"
          exit 1
        fi
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Stable-iOS-IPA
        path: ops-aware.ipa
