name: Build iOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install Cordova
      run: npm install -g cordova
        
    - name: Update iOS deployment target
      run: |
        # 更新 config.xml 中的部署目标
        sed -i.bak 's/<platform name="ios">/<platform name="ios">\
        <preference name="deployment-target" value="12.0" \/>/' config.xml
        
        # 重新添加 iOS 平台以应用更改
        rm -rf platforms/ios
        cordova platform add ios
        
    - name: Build for simulator with detailed output
      run: |
        cordova build ios --emulator --verbose
        
    - name: Comprehensive file search
      run: |
        echo "=== Complete project structure ==="
        find platforms/ios -type f -name "*" | head -50
        echo "=== Xcode build products ==="
        find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -20
        echo "=== Current directory deep search ==="
        find . -name "*.app" -type d 2>/dev/null | head -20
        
    - name: Create test IPA from any found app
      run: |
        # 查找任何 .app 文件
        APP_PATH=$(find . -name "*.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r test-app.ipa Payload
          rm -rf Payload
          echo "Created test IPA from found app"
        else
          echo "No .app files found to package"
        fi
        
    - name: Upload any found artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Build-Outputs
        path: |
          platforms/ios/build/
          test-app.ipa
        if-no-files-found: warn
        retention-days: 7
