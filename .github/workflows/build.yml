name: Build iOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install Cordova
      run: npm install -g cordova
        
    - name: Update iOS deployment target
      run: |
        # 更新 config.xml 中的部署目标
        sed -i.bak 's/<platform name="ios">/<platform name="ios">\
        <preference name="deployment-target" value="12.0" \/>/' config.xml
        
        # 重新添加 iOS 平台以应用更改
        rm -rf platforms/ios
        cordova platform add ios
        
    - name: Build for simulator (no signing required)
      run: |
        cordova build ios --emulator
        
    - name: Find and list build outputs
      run: |
        echo "=== Searching for build outputs ==="
        find platforms/ios -name "*.app" -o -name "*.ipa" | head -20
        echo "=== Build directory contents ==="
        ls -la platforms/ios/build/ || echo "No build directory"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Simulator-Build
        path: |
          platforms/ios/build/**/*.app
        if-no-files-found: warn
        retention-days: 7
