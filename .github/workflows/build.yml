name: Build iOS Simulator App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Cordova and setup
      run: |
        npm install -g cordova
        rm -rf platforms/ios
        rm -rf plugins/
        
    - name: Configure project for simulator
      run: |
        sed -i.bak 's/<name>运维态势感知平台<\/name>/<name>OpsAware<\/name>/' config.xml
        sed -i.bak 's/<platform name="ios">/<platform name="ios">\
        <preference name="deployment-target" value="12.0" \/>/' config.xml
        
    - name: Add iOS platform
      run: |
        cordova platform add ios
        
    - name: Build for simulator
      run: |
        cordova build ios --emulator
        
    - name: Find and package simulator app
      run: |
        SIMULATOR_APP=$(find platforms/ios/build -name "*.app" -type d | grep -i simulator | head -1)
        if [ -n "$SIMULATOR_APP" ]; then
          echo "Found simulator app: $SIMULATOR_APP"
          zip -q -r simulator-app.zip "$SIMULATOR_APP"
          echo "Simulator app packaged"
        else
          echo "Listing build directory:"
          find platforms/ios/build -type f -name "*" | head -20
          echo "No simulator app found"
          exit 1
        fi
        
    - name: Upload simulator app
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Simulator-App
        path: simulator-app.zip
