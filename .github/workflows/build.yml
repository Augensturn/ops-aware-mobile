name: Build iOS App

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install Cordova and iOS dependencies
      run: |
        npm install -g cordova
        sudo gem install cocoapods
        
    - name: Clean and recreate iOS platform
      run: |
        # 删除可能损坏的 iOS 平台
        rm -rf platforms/ios
        rm -rf plugins/
        
        # 重新添加 iOS 平台
        cordova platform add ios
        
        # 检查是否生成了 Podfile
        echo "=== Checking iOS platform structure ==="
        ls -la platforms/ios/
        
    - name: Build iOS app
      run: |
        cordova build ios
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Build
        path: platforms/ios/build/**/*.ipa
        retention-days: 7
