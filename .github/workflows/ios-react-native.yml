name: Build React Native iOS App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Install iOS dependencies
      run: |
        cd ios
        pod install --repo-update
        cd ..
      
    - name: Build iOS app
      run: |
        npx react-native run-ios --configuration Release --device
      
    - name: Create IPA from build
      run: |
        APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
        if [ -n "$APP_PATH" ]; then
          echo "Found app: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -q -r ops-aware-mobile.ipa Payload
          rm -rf Payload
          echo "IPA created successfully"
        else
          echo "Error: No .app file found"
          find ios/build -type f -name "*" | head -20
          exit 1
        fi
      
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: React-Native-iOS-IPA
        path: ops-aware-mobile.ipa
        retention-days: 30
